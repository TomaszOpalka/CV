  <!-- hair -->
  <path d="M232 420 C220 250 330 190 410 190 C500 190 590 260 568 420 C550 330 500 290 410 288 C320 290 262 340 232 420 Z" fill="url(#hair)"/>
  <!-- eyes, brows, mouth: soft darker marks for contrast -->
