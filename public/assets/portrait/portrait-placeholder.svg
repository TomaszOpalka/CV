  <ellipse cx="460" cy="440" rx="24" ry="11" fill="#4a4a4a"/>
  <rect x="304" y="404" width="72" height="9" rx="4" fill="#3a3a3a"/>
  <rect x="424" y="404" width="72" height="9" rx="4" fill="#3a3a3a"/>
  <path d="M356 560 C390 590 410 590 444 560" stroke="#555" stroke-width="12" fill="none" stroke-linecap="round"/>
