[build]
  command = "npm run build"
  publish = "out"
  # Skip the build when only docs changed (exit 0 = skip, non-zero = build).
  # Saves Netlify credits: every successful production deploy costs 15 of 300 monthly credits.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- src/ public/ netlify/ package.json package-lock.json next.config.ts netlify.toml tsconfig.json"

[build.environment]
  NODE_VERSION = "24"
  # Pure static export (output: 'export'): bypass the Next.js runtime adapter and publish out/.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Security headers for the static site.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Long-lived cache for hashed Next.js assets.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
